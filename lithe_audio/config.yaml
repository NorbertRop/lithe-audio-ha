name: Lithe Audio
version: "0.1.0"
slug: lithe_audio
description: Local EQ, volume and settings control for Lithe Audio Wi-Fi speakers
url: https://github.com/NorbertRop/lithe-audio-ha
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-wireless
panel_title: Lithe Audio
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  discovery: true
  speakers: []
  mqtt_enabled: true
  log_level: info
schema:
  discovery: bool
  speakers:
    - str
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
